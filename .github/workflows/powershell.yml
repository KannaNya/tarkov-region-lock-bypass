name: PowerShell syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell scripts
        shell: pwsh
        run: ./tests/syntax-check.ps1
      - name: Check Windows PowerShell 5.1 compatibility
        shell: powershell
        run: .\tests\syntax-check.ps1
